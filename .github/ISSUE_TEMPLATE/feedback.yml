  - type: textarea
    id: risk
    attributes:
      label: リスク・切戻し
      description: 具体値と根拠を記載。未確認は未確認と明記。
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連課題・依存
      description: 具体値と根拠を記載。未確認は未確認と明記。
