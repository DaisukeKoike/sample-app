name: feedback
description: 根拠と受入基準を備えた課題
labels: [feedback]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要・背景
      description: 具体値と根拠を記載。未確認は未確認と明記。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順・現状
      description: 具体値と根拠を記載。未確認は未確認と明記。
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: 調査結果
      description: 具体値と根拠を記載。未確認は未確認と明記。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
