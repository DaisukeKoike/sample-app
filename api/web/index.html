<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Lab</title>
<style>body{font:15px system-ui;background:#eef2f7;color:#182b44;margin:0}header{background:#14243b;color:white;padding:24px 5%}main{max-width:1200px;margin:auto;padding:24px}section{background:white;padding:22px;border-radius:12px;margin-bottom:20px}button,input,select{padding:10px;border:1px solid #c6d1df;border-radius:6px;margin:4px}button{background:#235fbd;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}#error{color:#ad1f2f}small{color:#aacaee}.scroll{overflow:auto}</style>
<header><h1>Project Lab / 案件・タスク管理</h1><small>演習専用・架空データ・意図的な不具合を含みます。本番利用不可。</small></header>
<main><section><h2>全体ダッシュボード</h2><p id="stats"></p></section>
<section><h2>タスク一覧</h2><select id="project"><option value="">全案件</option></select><select id="status"><option value="">全状態</option><option>todo</option><option>doing</option><option>done</option></select><input id="q" placeholder="タイトル検索"><label>期限の終了日<input id="end" type="date"></label><button id="search">検索</button><button id="csv">CSV</button><p id="error" role="alert"></p><div class="scroll"><table><thead><tr><th>ID</th><th>案件</th><th>タイトル</th><th>状態</th><th>期限</th><th>見積/実績</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><button id="prev">前へ</button><span id="paging"></span><button id="next">次へ</button></section>
<section><h2>タスク登録</h2><form id="create"><input name="title" placeholder="タイトル" required maxlength="200"><select name="project_id" id="newproject"></select><input name="due" type="date" required><input name="estimate" type="number" min="0" value="3"><button>登録</button></form></section>
<section><h2>コメント</h2><input id="taskid" type="number" min="1" placeholder="タスクID"><input id="comment" maxlength="2000" placeholder="コメント"><button id="addcomment">追加</button><button id="readcomments">表示</button><pre id="comments"></pre></section></main>
<script>
let page=1,total=0;const el=id=>document.getElementById(id);
async function api(url,options){const r=await fetch(url,options);const b=await r.json();if(!r.ok)throw Error(b.error);return b}
function params(){const p=new URLSearchParams({page,size:10});for(const [id,key] of [['project','project_id'],['status','status'],['q','q'],['end','end']])if(el(id).value)p.set(key,el(id).value);return p}
async function load(){try{el('error').textContent='';const [data,d]=await Promise.all([api('/api/tasks?'+params()),api('/api/dashboard')]);total=data.total;el('stats').textContent=`全${d.total}件 / 完了${d.done}件 / 完了率${d.completion}% / 見積${d.estimate}h / 実績${d.actual}h`;el('rows').replaceChildren();for(const t of data.items){const tr=document.createElement('tr');for(const v of [t.id,t.project_id,t.title,t.status,t.due,`${t.estimate}/${t.actual}h`]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td');for(const state of ['todo','doing','done']){const b=document.createElement('button');b.textContent=state;b.onclick=()=>safe(async()=>{await api('/api/tasks/'+t.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:state,version:t.version})});await load()});td.append(b)}tr.append(td);el('rows').append(tr)}el('paging').textContent=`${page} / ${Math.max(1,Math.ceil(total/10))} (${total}件)`;el('prev').disabled=page===1;el('next').disabled=page*10>=total}catch(e){el('error').textContent=e.message}}
async function safe(fn){try{await fn()}catch(e){el('error').textContent=e.message}}
el('search').onclick=()=>{page=1;load()};el('prev').onclick=()=>{page--;load()};el('next').onclick=()=>{page++;load()};el('csv').onclick=()=>{location.href='/api/export?'+params()};
el('create').onsubmit=e=>{e.preventDefault();safe(async()=>{const data=Object.fromEntries(new FormData(e.target));await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});await load()})};
el('addcomment').onclick=()=>safe(async()=>{await api('/api/tasks/'+el('taskid').value+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:el('comment').value})});el('comment').value=''});
el('readcomments').onclick=()=>safe(async()=>{const c=await api('/api/tasks/'+el('taskid').value+'/comments');el('comments').textContent=c.map(x=>x.body).join('\n')});
safe(async()=>{for(const p of await api('/api/projects'))for(const id of ['project','newproject']){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;el(id).append(o)}await load()});
</script></html>
